<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservato Booking Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #020617;
            color: #e2e8f0;
            padding: 40px 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; color: #22d3ee; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; font-size: 14px; }
        .diagram-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 40px;
            overflow-x: auto;
        }
        svg { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RESERVATO BOOKING FLOW</h1>
        <p class="subtitle">Customer Reservation Journey with Hermes Agents</p>
        
        <div class="diagram-card">
            <svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
                    </pattern>
                    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
                    </marker>
                    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
                    </marker>
                    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
                    </marker>
                </defs>
                
                <rect width="1400" height="900" fill="url(#grid)"/>
                
                <!-- Step 1: Customer -->
                <rect x="50" y="50" width="200" height="100" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
                <text x="150" y="85" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="bold">1. CUSTOMER</text>
                <text x="150" y="105" text-anchor="middle" fill="#94a3b8" font-size="11">Web / Telegram / SMS</text>
                
                <!-- Arrow to Step 2 -->
                <line x1="250" y1="100" x2="350" y2="100" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-blue)"/>
                <text x="300" y="90" text-anchor="middle" fill="#22d3ee" font-size="10">Booking Request</text>
                
                <!-- Step 2: Hermes Booking Agent -->
                <rect x="350" y="50" width="250" height="100" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
                <text x="475" y="80" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">2. BOOKING AGENT</text>
                <text x="475" y="100" text-anchor="middle" fill="#e2e8f0" font-size="11">• Parse natural language</text>
                <text x="475" y="115" text-anchor="middle" fill="#e2e8f0" font-size="11">• Validate party size/date</text>
                <text x="475" y="130" text-anchor="middle" fill="#e2e8f0" font-size="11">• Check availability</text>
                
                <!-- Arrow to Step 3 -->
                <line x1="600" y1="100" x2="700" y2="100" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
                <text x="650" y="90" text-anchor="middle" fill="#34d399" font-size="10">Query DB</text>
                
                <!-- Step 3: Database -->
                <rect x="700" y="50" width="200" height="100" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="2"/>
                <text x="800" y="85" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">3. POSTGRESQL</text>
                <text x="800" y="105" text-anchor="middle" fill="#94a3b8" font-size="11">Railway Managed DB</text>
                <text x="800" y="125" text-anchor="middle" fill="#94a3b8" font-size="11">Check availability</text>
                
                <!-- Arrow back to Agent -->
                <line x1="700" y1="130" x2="600" y2="130" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
                <text x="650" y="145" text-anchor="middle" fill="#a78bfa" font-size="10">Available slots</text>
                
                <!-- Arrow to Step 4 -->
                <line x1="475" y1="150" x2="475" y2="250" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
                
                <!-- Step 4: Create Reservation -->
                <rect x="350" y="250" width="250" height="100" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
                <text x="475" y="280" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">4. CREATE RESERVATION</text>
                <text x="475" y="300" text-anchor="middle" fill="#e2e8f0" font-size="11">• Generate confirmation code</text>
                <text x="475" y="315" text-anchor="middle" fill="#e2e8f0" font-size="11">• Save to database</text>
                <text x="475" y="330" text-anchor="middle" fill="#e2e8f0" font-size="11">• Track agent session</text>
                
                <!-- Arrow to Step 5 -->
                <line x1="475" y1="350" x2="475" y2="450" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
                <text x="485" y="400" fill="#fb923c" font-size="10">Trigger</text>
                
                <!-- Step 5: Confirmation Agent -->
                <rect x="350" y="450" width="250" height="120" rx="8" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="2"/>
                <text x="475" y="480" text-anchor="middle" fill="#fb923c" font-size="14" font-weight="bold">5. CONFIRMATION AGENT</text>
                <text x="475" y="505" text-anchor="middle" fill="#e2e8f0" font-size="11">• Send email (Resend)</text>
                <text x="475" y="520" text-anchor="middle" fill="#e2e8f0" font-size="11">• Send SMS (Twilio)</text>
                <text x="475" y="535" text-anchor="middle" fill="#e2e8f0" font-size="11">• Include confirmation code</text>
                <text x="475" y="550" text-anchor="middle" fill="#e2e8f0" font-size="11">• Add calendar link</text>
                
                <!-- Arrows to Email and SMS -->
                <line x1="350" y1="510" x2="250" y2="510" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
                <line x1="600" y1="510" x2="700" y2="510" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
                
                <!-- Email -->
                <rect x="100" y="460" width="150" height="100" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
                <text x="175" y="490" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">EMAIL</text>
                <text x="175" y="510" text-anchor="middle" fill="#e2e8f0" font-size="11">Resend API</text>
                <text x="175" y="530" text-anchor="middle" fill="#94a3b8" font-size="10">Confirmation + details</text>
                <text x="175" y="545" text-anchor="middle" fill="#94a3b8" font-size="10">Calendar attachment</text>
                
                <!-- SMS -->
                <rect x="700" y="460" width="150" height="100" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
                <text x="775" y="490" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">SMS</text>
                <text x="775" y="510" text-anchor="middle" fill="#e2e8f0" font-size="11">Twilio API</text>
                <text x="775" y="530" text-anchor="middle" fill="#94a3b8" font-size="10">Confirmation code</text>
                <text x="775" y="545" text-anchor="middle" fill="#94a3b8" font-size="10">Reminder 24h before</text>
                
                <!-- Arrow to Step 6 -->
                <line x1="475" y1="570" x2="475" y2="670" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
                
                <!-- Step 6: Analytics Agent -->
                <rect x="350" y="670" width="250" height="100" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="2"/>
                <text x="475" y="700" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">6. ANALYTICS AGENT</text>
                <text x="475" y="720" text-anchor="middle" fill="#e2e8f0" font-size="11">• Update occupancy rate</text>
                <text x="475" y="735" text-anchor="middle" fill="#e2e8f0" font-size="11">• Track peak times</text>
                <text x="475" y="750" text-anchor="middle" fill="#e2e8f0" font-size="11">• Revenue tracking</text>
                
                <!-- Arrow to Dashboard -->
                <line x1="600" y1="720" x2="700" y2="720" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
                
                <!-- Dashboard -->
                <rect x="700" y="670" width="250" height="100" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
                <text x="825" y="700" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="bold">ADMIN DASHBOARD</text>
                <text x="825" y="725" text-anchor="middle" fill="#e2e8f0" font-size="11">• Real-time reservations</text>
                <text x="825" y="745" text-anchor="middle" fill="#94a3b8" font-size="10">• Occupancy heatmap</text>
                <text x="825" y="760" text-anchor="middle" fill="#94a3b8" font-size="10">• Revenue charts</text>
                
                <!-- Reminder Flow (bottom) -->
                <rect x="50" y="800" width="1300" height="80" rx="8" fill="rgba(6, 78, 59, 0.2)" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4"/>
                <text x="700" y="825" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">AUTOMATED REMINDERS (24 hours before)</text>
                <text x="700" y="850" text-anchor="middle" fill="#94a3b8" font-size="10">Hermes cron job → Confirmation Agent → Email + SMS → Customer</text>
                
                <!-- Legend -->
                <g transform="translate(50, 820)">
                    <text x="0" y="-10" fill="#e2e8f0" font-size="11" font-weight="bold">Legend:</text>
                    <rect x="0" y="5" width="16" height="16" rx="3" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
                    <text x="22" y="18" fill="#94a3b8" font-size="9">Hermes Agents</text>
                    
                    <rect x="120" y="5" width="16" height="16" rx="3" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
                    <text x="142" y="18" fill="#94a3b8" font-size="9">Customer/Frontend</text>
                    
                    <rect x="240" y="5" width="16" height="16" rx="3" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
                    <text x="262" y="18" fill="#94a3b8" font-size="9">Database</text>
                    
                    <rect x="340" y="5" width="16" height="16" rx="3" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"/>
                    <text x="362" y="18" fill="#94a3b8" font-size="9">External Services</text>
                    
                    <line x1="480" y1="13" x2="500" y2="13" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
                    <text x="510" y="18" fill="#94a3b8" font-size="9">Data Flow</text>
                </g>
            </svg>
        </div>
    </div>
</body>
</html>
